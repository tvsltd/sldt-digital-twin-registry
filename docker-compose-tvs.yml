# Docker Compose configuration for Digital Twin Registry
version: '3'

services:
  # PostgreSQL Database Service
  # Provides the main data storage for the Digital Twin Registry
  postgres:
    image: postgres:15.6-alpine
    container_name: postgres
    ports:
      - "5432:5432"  # Host:Container port mapping
    environment:
      POSTGRES_PASSWORD: example  # WARNING: Change in production
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persist database data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin Service
  # Web-based PostgreSQL administration tool
  pgadmin:
    image: dpage/pgadmin4:4.23
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com      # WARNING: Change in production
      PGADMIN_DEFAULT_PASSWORD: password            # WARNING: Change in production
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "15432:80"  # Access pgAdmin at localhost:15432
    volumes:
      - pgadmin:/var/lib/pgadmin  # Persist pgAdmin data
    depends_on:
      - postgres  # Ensure postgres starts first

  # Digital Twin Registry Service
  # Main application service
  digital_twin_registry:
    container_name: digital_twin_registry
    build:
      dockerfile: Dockerfile
    command: "java -jar /app/backend/target/digital-twin-registry-backend-DEV-SNAPSHOT.jar"
    ports:
      - "4243:4243"  # Application port mapping
    environment:
      # Java Runtime Configuration
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2048m  # JVM memory settings

      # Database Connection Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: example      # WARNING: Change in production
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 0

      # Application Configuration
      SPRING_PROFILES_ACTIVE: local           # Development profile
      IDP_ISSUER_URI: ""                     # Identity provider URI (empty for local dev)

    volumes:
      - ./build:/app/build  # Mount build directory for development
    depends_on:
      - postgres  # Ensure database is available before starting

# Persistent Volume Configuration
volumes:
  postgres-data:    # Volume for PostgreSQL data
    driver: local
  pgadmin:         # Volume for pgAdmin data
    driver: local